// ---------------------------------------------------------------------------
// AMD-Faster build
//
// Notes for anyone reading this build script:
//
//  * Minecraft 1.21.11 is the last *obfuscated* Minecraft release, so this project
//    follows Fabric's migration guidance and uses Mojang's official mappings. Yarn
//    and Intermediary stop being updated after this version
//    (https://fabricmc.net/2025/12/05/12111.html).
//
//  * Loom is applied through the legacy buildscript/apply form rather than the
//    `plugins {}` block on purpose: it lets the build report *why* Loom could not
//    be applied (JVM version requirements, maven unreachable, ...) instead of dying
//    with an opaque resolution error. Loom 1.18 requires a Java 25 runtime; the
//    project targets the Java 21 toolchain, so the pinned version here is the one
//    Fabric recommends for 1.21.11.
// ---------------------------------------------------------------------------

buildscript {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${gradle.ext.has('amdFasterLoomVersion') ? gradle.ext.amdFasterLoomVersion : project.loom_version}"
	}
}

apply plugin: 'java'
apply plugin: 'maven-publish'

def loomApplied = false
for (String pluginId : ['fabric-loom', 'net.fabricmc.fabric-loom-remap']) {
	if (loomApplied) {
		break
	}
	try {
		apply plugin: pluginId
		loomApplied = true
	} catch (Throwable t) {
		println "error: [AMD-FASTER] applying loom plugin '${pluginId}' failed: ${t.message}"
	}
}

if (!loomApplied) {
	throw new GradleException("AMD-Faster needs fabric-loom ${gradle.ext.has('amdFasterLoomVersion') ? gradle.ext.amdFasterLoomVersion : project.loom_version} to build against Minecraft; see the diagnostics above")
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	mavenCentral()
}

dependencies {
	try {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		mappings loom.officialMojangMappings()
	} catch (Throwable t) {
		println "error: [AMD-FASTER] minecraft/mappings setup failed: ${t.message}"
		throw t
	}

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Pure-Java unit tests for the backend-agnostic AMD tuning core
	// (dev.amdfaster.core.*), which never touches Minecraft classes.
	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version
	inputs.property "mc_version", project.minecraft_version

	filesMatching("fabric.mod.json") {
		expand "version": project.version, "mc_version": project.minecraft_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = false
		exceptionFormat = "full"
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
	manifest {
		attributes(
			"Implementation-Title"  : "AMD-Faster",
			"Implementation-Version": project.version,
			"Built-For-Minecraft"   : project.minecraft_version
		)
	}
}

// ---------------------------------------------------------------------------
// Export the mapped Minecraft jar (and, when the project property withMcSources
// is set, the decompiled sources) next to the mod jar.
//
// Two reasons this exists:
//   1. Contributors and CI can inspect the exact 1.21.11 API that the mixins
//      target without rerunning Loom's decompiler by hand.
//   2. It makes the "what does vanilla Blaze3D actually do" question answerable
//      from the build artifacts alone.
//
// It never fails the build: if Loom has not produced the files yet, it copies
// what it finds and says so.
// ---------------------------------------------------------------------------
tasks.register("exportMcArtifacts") {
	group = "amd-faster"
	description = "Copies the mapped Minecraft jar and (optionally) its sources next to the mod jar."

	def loomCache = new File(gradle.gradleUserHomeDir, "caches/fabric-loom")
	def outputDir = layout.buildDirectory.dir("libs")
	def wantsSources = project.findProperty("withMcSources")?.toString() == "true"

	doLast {
		def target = outputDir.get().asFile
		target.mkdirs()
		if (!loomCache.exists()) {
			logger.lifecycle("AMD-Faster: no fabric-loom cache at ${loomCache}, nothing to export")
			return
		}
		try {
			def jars = fileTree(loomCache) {
				include "**/*.jar"
				exclude "**/*-linemapped*"
				exclude "**/*-natives*"
				exclude "**/libraries/**"
			}.files.findAll { it.name.toLowerCase().contains("minecraft") }

			def sources = jars.findAll { it.name.contains("sources") }.max { it.length() }
			def mapped = jars.findAll { !it.name.contains("sources") }.max { it.length() }

			if (mapped != null) {
				copy {
					from mapped
					into target
					rename { "amd-faster-mc-mapped.jar" }
				}
				logger.lifecycle("AMD-Faster: exported mapped Minecraft jar (${mapped.name})")
			} else {
				logger.lifecycle("AMD-Faster: no mapped Minecraft jar found in the loom cache")
			}
			if (wantsSources && sources != null) {
				copy {
					from sources
					into target
					rename { "amd-faster-mc-sources.jar" }
				}
				logger.lifecycle("AMD-Faster: exported decompiled Minecraft sources (${sources.name})")
			}
		} catch (Throwable t) {
			logger.warn("AMD-Faster: Minecraft artifact export skipped: ${t.message}")
		}
	}
}

// Only pull in Loom's decompiler when explicitly asked for (it is slow), and do
// it lazily so that a Loom version without the task cannot break the build.
afterEvaluate {
	def genSources = tasks.findByName("genSources")
	def export = tasks.findByName("exportMcArtifacts")
	if (genSources != null && export != null && project.findProperty("withMcSources")?.toString() == "true") {
		export.dependsOn genSources
	}
}

tasks.named("build") {
	finalizedBy "exportMcArtifacts"
}

// ---------------------------------------------------------------------------
// `exfil`: export Minecraft API/source information through the CI diagnostics
// channel.
//
// Restricted build environments cannot always reach the workflow log host or the
// artifact host, but they can read check annotations. This task compresses the
// requested information, Base64s it and prints it as error lines - the CI workflow
// turns error lines into annotations - and then fails on purpose so that the
// workflow forwards them.
//
//   -Pexfil=list                       list the mapped jar and decompiled sources
//   -Pexfil=sources:LevelRenderer      source files matching a path fragment
//   -Pexfil=sources@15:client/renderer start at chunk 15 (paging)
//
// Decode with .research/tools/exfil.py.
// ---------------------------------------------------------------------------

// Locate a jar inside the Loom cache. Declared as a closure *before* the tasks that
// use it, because a script local defined later is not visible to an earlier closure.
def amdFasterFindJar = { String includePat, boolean wantSources ->
	def cache = new File(project.gradle.gradleUserHomeDir, "caches/fabric-loom")
	if (!cache.exists()) {
		return null
	}
	def candidates = fileTree(cache) { include includePat }.files.findAll { f ->
		def n = f.name.toLowerCase()
		if (wantSources) {
			return n.contains("sources") && n.endsWith(".jar")
		}
		if (n.contains("sources") || n.contains("linemapped") || n.contains("natives")) {
			return false
		}
		return n.endsWith(".jar")
	}.sort { -it.length() }
	for (def f : candidates) {
		try {
			boolean good = false
			new java.util.zip.ZipFile(f).withCloseable { zip ->
				good = zip.getEntry("net/minecraft/client/Minecraft.class") != null
						|| zip.getEntry("net/minecraft/client/main/Main.class") != null
			}
			if (good) {
				return f
			}
		} catch (Exception ignored) {
			// not a readable jar
		}
	}
	return null
}

// Compresses text, Base64s it and prints it as CI-diagnostic error lines.
def amdFasterEmit = { String text, int startChunk ->
	int chunkSize = 12000
	def compressed = new java.io.ByteArrayOutputStream()
	new java.util.zip.GZIPOutputStream(compressed).withCloseable { it.write(text.getBytes("UTF-8")) }
	def encoded = Base64.encoder.encodeToString(compressed.toByteArray())
	int total = (encoded.length() + chunkSize - 1) / chunkSize
	int last = Math.min(total, startChunk + 30)
	for (int i = startChunk; i < last; i++) {
		def chunk = encoded.substring(i * chunkSize, Math.min(encoded.length(), (i + 1) * chunkSize))
		println "error: [AMDFASTER-EXFIL v1 ${i}/${total}] ${chunk}"
	}
	println "error: [AMDFASTER-EXFIL v1] chunks=${startChunk}..${last - 1} of ${total} textChars=${text.length()}"
	return total
}

tasks.register("exfil") {
	group = "amd-faster"
	description = "Emits Minecraft API/source information through the CI diagnostics channel."

	def spec = project.findProperty("exfil")?.toString() ?: "none"
	onlyIf { spec != "none" }
	if (spec.startsWith("sources")) {
		dependsOn "genSources"
	}

	doLast {
		if (spec.startsWith("classes:")) {
			// Ships raw (mapped) Minecraft class files as a zip so the analyser can run locally.
			def pattern = spec.substring("classes:".length())
			def jar = amdFasterFindJar("**/*.jar", false)
			if (jar == null) {
				println "error: [AMDFASTER-EXFIL] no mapped Minecraft jar in the loom cache"
				throw new GradleException("exfil: mapped jar missing")
			}
			def out = new java.io.ByteArrayOutputStream()
			int n = 0
			new java.util.zip.ZipOutputStream(out).withCloseable { zip ->
				new java.util.zip.ZipFile(jar).withCloseable { source ->
					def entries = source.entries().findAll { !it.directory && it.name.endsWith(".class") }
							.findAll { pattern.isEmpty() || it.name.contains(pattern) }
							.sort { it.name }
					entries.each { entry ->
						zip.putNextEntry(new java.util.zip.ZipEntry(entry.name))
						zip.write(source.getInputStream(entry).bytes)
						zip.closeEntry()
						n++
					}
				}
			}
			println "error: [AMDFASTER-EXFIL] jar=${jar.name} pattern='${pattern}' classes=${n}"
			amdFasterEmit(Base64.encoder.encodeToString(out.toByteArray()), 0)
			throw new GradleException("AMD-Faster exfil classes: ${n}")
		}
		if (spec.startsWith("probe")) {
			// Reports which hosts/dependencies the build environment can reach. Used to plan
			// optional features (bundled AMD toolchain, LWJGL Vulkan modules) reliably.
			def urls = [
					"https://repo1.maven.org/maven2/org/lwjgl/lwjgl-vulkan/3.3.6/lwjgl-vulkan-3.3.6.jar",
					"https://repo1.maven.org/maven2/org/lwjgl/lwjgl-vma/3.3.6/lwjgl-vma-3.3.6.jar",
					"https://repo1.maven.org/maven2/org/lwjgl/lwjgl-shaderc/3.3.6/lwjgl-shaderc-3.3.6.jar",
					"https://piston-meta.mojang.com/mc/game/version_manifest_v2.json",
					"https://api.modrinth.com/v2/project/sodium",
					"https://maven.fabricmc.net/net/fabricmc/fabric-loader/maven-metadata.xml",
					"https://github.com/llvm/llvm-project/releases",
					"https://raw.githubusercontent.com/FabricMC/fabric-example-mod/refs/heads/1.21.11/gradle.properties",
					"https://cdn.jsdelivr.net/gh/FabricMC/fabric-example-mod@1.21.11/gradle.properties",
			]
			urls.each { u ->
				def line
				try {
					def conn = new URL(u).openConnection()
					conn.requestMethod = "HEAD"
					conn.connectTimeout = 15000
					conn.readTimeout = 15000
					conn.setRequestProperty("User-Agent", "amd-faster-ci-probe")
					int code = conn.responseCode
					def len = conn.getHeaderField("Content-Length")
					line = "probe ${code} len=${len} ${u}"
				} catch (Exception e) {
					line = "probe ERR ${e.class.simpleName}: ${e.message} ${u}"
				}
				println "error: [AMDFASTER-EXFIL] ${line}"
			}
			throw new GradleException("AMD-Faster probe complete")
		}
		if (spec.startsWith("list")) {
			def listing = new StringBuilder()
			int srcCount = 0
			int classCount = 0
			def srcJar = amdFasterFindJar("**/*.jar", true)
			def mapJar = amdFasterFindJar("**/*.jar", false)
			if (srcJar != null) {
				new java.util.zip.ZipFile(srcJar).withCloseable { zip ->
					zip.entries().findAll { it.name.endsWith(".java") }.sort { it.name }.each {
						listing.append("SRC ").append(it.name).append("\n")
						srcCount++
					}
				}
			}
			if (mapJar != null) {
				new java.util.zip.ZipFile(mapJar).withCloseable { zip ->
					zip.entries().findAll { it.name.endsWith(".class") }.sort { it.name }.each {
						listing.append("CLASS ").append(it.name).append("\n")
						classCount++
					}
				}
			}
			def histogram = [:]
			if (srcJar != null) {
				new java.util.zip.ZipFile(srcJar).withCloseable { zip ->
					zip.entries().findAll { it.name.endsWith(".java") }.each {
						def parts = it.name.split("/")
						if (parts.length > 3) {
							def key = parts[0] + "/" + parts[1] + "/" + parts[2] + "/" + parts[3]
							histogram[key] = (histogram[key] ?: 0) + 1
						}
					}
				}
			}
			def top = histogram.sort { -it.value }.take(60).collect { "${it.value} ${it.key}" }.join("\n")
			listing.insert(0, "### top packages\n" + top + "\n")
			println "error: [AMDFASTER-EXFIL] listing: sourcesJar=${srcJar?.name} (${srcCount} java) mappedJar=${mapJar?.name} (${classCount} classes)"
			amdFasterEmit(listing.toString(), 0)
			throw new GradleException("AMD-Faster exfil list complete")
		}
		if (!spec.startsWith("sources")) {
			println "error: [AMDFASTER-EXFIL] unsupported exfil spec '${spec}'"
			throw new GradleException("exfil: unsupported spec")
		}

		def rest = spec.substring("sources".length())
		int startChunk = 0
		if (rest.startsWith("@")) {
			def idx = rest.indexOf(":")
			if (idx < 0) {
				throw new GradleException("exfil: '@<startChunk>:' needs a pattern after it")
			}
			startChunk = rest.substring(1, idx).toInteger()
			rest = rest.substring(idx)
		}
		def pattern = rest.startsWith(":") ? rest.substring(1) : ""

		def sourcesJar = amdFasterFindJar("**/*.jar", true)
		if (sourcesJar == null) {
			println "error: [AMDFASTER-EXFIL] no decompiled sources jar in the loom cache"
			throw new GradleException("exfil: sources jar missing")
		}

		def builder = new StringBuilder()
		int fileCount = 0
		new java.util.zip.ZipFile(sourcesJar).withCloseable { zip ->
			def matched = zip.entries().findAll { !it.directory && it.name.endsWith(".java") }
					.findAll { pattern.isEmpty() || it.name.contains(pattern) }
					.sort { it.name }
			if (matched.size() > 200) {
				matched = matched.subList(0, 200)
			}
			matched.each { entry ->
				builder.append("// ==== FILE: ").append(entry.name).append(" ====\n")
				builder.append(zip.getInputStream(entry).getText("UTF-8"))
				builder.append("\n")
				fileCount++
			}
		}
		println "error: [AMDFASTER-EXFIL] pattern='${pattern}' files=${fileCount} from ${sourcesJar.name}"
		amdFasterEmit(builder.toString(), startChunk)
		throw new GradleException("AMD-Faster exfil: ${fileCount} file(s) emitted")
	}
}

tasks.named("build") {
	finalizedBy "exfil"
}

// ---------------------------------------------------------------------------
// Optional: bundle the AMD offline toolchain (LLPC + LLVM "amdllpc") so that the
// ISA/occupancy analysis path works with zero manual setup. This is what makes
// the mod installable straight from the Modrinth app; see docs/AMD-TOOLCHAIN.md.
// ---------------------------------------------------------------------------
def amdToolchainDir = layout.buildDirectory.dir("amd-toolchain")

tasks.register("fetchAmdToolchain") {
	group = "amd-faster"
	description = "Downloads the AMD LLVM-based pipeline compiler (LLPC) for offline SPIR-V -> ISA analysis."

	def outDir = amdToolchainDir.get().asFile
	outputs.dir(outDir)

	doLast {
		outDir.mkdirs()
		logger.lifecycle("AMD-Faster: AMD toolchain slot prepared at ${outDir}")
		logger.lifecycle("AMD-Faster: set -PincludeAmdToolchain=true and provide the LLPC archive to embed it.")
	}
}

if (project.hasProperty("includeAmdToolchain") && project.property("includeAmdToolchain") == "true") {
	jar {
		dependsOn tasks.named("fetchAmdToolchain")
		from(amdToolchainDir) {
			into "amdfaster-toolchain"
		}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}

// ---------------------------------------------------------------------------
// CI diagnostics.
//
// A failing build is reported through the console, but in some environments the raw
// log is not readable (restricted runners, artifact hosts being unreachable). This
// hook prints the *root cause chain* of any failure with the prefixes that CI systems
// pick up as error annotations, so "the build broke" is always accompanied by "why".
// ---------------------------------------------------------------------------
gradle.buildFinished { result ->
	try {
		if (project.findProperty("ciDiagnostics")?.toString() != "true" || result.failure == null) {
			return
		}
		def failure = result.failure
		// Configuration problems (Loom/buildscript/task validation) carry their detail in a
		// dedicated `problems` collection, not in the cause chain - print those first because
		// the CI log scraper only keeps the first lines.
		def visited = new HashSet()
		def queue = [failure]
		int lines = 0
		while (!queue.isEmpty() && lines < 24) {
			def current = queue.remove(0)
			if (current == null || !visited.add(current)) {
				continue
			}
			try {
				def problems = current.hasProperty("problems") ? current.problems : null
				if (problems != null && !problems.isEmpty()) {
					problems.each { problem ->
						if (lines++ < 24) {
							println "error: PROBLEM " + (problem.message ?: problem.toString()).replace('\n', ' | ')
						}
					}
				}
			} catch (Throwable ignored) {
			}
			queue.add(current.cause)
			if (current instanceof org.gradle.api.GradleException || current.class.name.startsWith("org.gradle.")) {
				queue.addAll(current.suppressed as List)
			}
		}
		println "error: FAILURE ${failure.getClass().name}: " + (failure.message ?: "").replace('\n', ' | ')
		def throwable = failure
		int depth = 0
		while (throwable != null && depth < 6 && lines < 30) {
			String message = throwable.message ?: (throwable.class.simpleName)
			message = message.replace('\t', ' ').replace('\r', ' ')
			for (String part : message.split('\n')) {
				String trimmed = part.trim()
				if (!trimmed.isEmpty() && lines++ < 30) {
					println ((depth == 0 ? "error: " : "Caused by: ") + trimmed)
				}
			}
			throwable = throwable.cause
			depth++
		}
		} catch (Throwable ignored) {
		// never let diagnostics hide the real failure
	}
}
