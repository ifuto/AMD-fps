// shaderc on the build script classpath so the GLSL can be compiled to SPIR-V during the build.
// The mod ships the compiled SPIR-V; a player never needs a GLSL toolchain.
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.lwjgl:lwjgl:3.3.3"
        classpath "org.lwjgl:lwjgl-shaderc:3.3.3"
        // LWJGL extracts its natives from the classpath at load time, so the platform classifier
        // has to be here rather than only in the test runtime.
        classpath "org.lwjgl:lwjgl:3.3.3:natives-linux"
        classpath "org.lwjgl:lwjgl-shaderc:3.3.3:natives-linux"
        classpath "org.lwjgl:lwjgl:3.3.3:natives-windows"
        classpath "org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows"
        classpath "org.lwjgl:lwjgl:3.3.3:natives-macos"
        classpath "org.lwjgl:lwjgl-shaderc:3.3.3:natives-macos"
        // ASM reads Minecraft's class files without loading them, so verifyMixinTargets can check that
        // every mixin target really exists in the version being built against. Loading the classes instead
        // would need LWJGL's natives on the build machine and would run their static initialisers.
        classpath "org.ow2.asm:asm:9.7.1"
    }
}

plugins {
    id 'fabric-loom' version '1.16.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API is a *runtime* requirement declared in fabric.mod.json, not a
    // jar-in-jar. The Modrinth app resolves it automatically, so AMD-Faster stays
    // a single-file download while never shipping a half-assembled Fabric API.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Minecraft ships lwjgl / lwjgl-glfw / lwjgl-opengl but NOT lwjgl-vulkan,
    // so the Vulkan bindings have to be bundled with the mod.
    include(implementation("org.lwjgl:lwjgl-vulkan:${project.lwjgl_version}"))

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // shaderc compiles the .comp sources to SPIR-V in ShaderCompileTest. Test-only and not
    // bundled: the mod ships pre-compiled SPIR-V, so a player never needs a GLSL compiler.
    // Without this the shaders are text nobody has checked, and a typo in a compute shader
    // surfaces as a driver error at runtime on someone else's machine.
    testImplementation "org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}"
    for (String nativesClassifier in ["natives-linux", "natives-windows", "natives-macos", "natives-macos-arm64"]) {
        testRuntimeOnly "org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}:${nativesClassifier}"
        testRuntimeOnly "org.lwjgl:lwjgl:${project.lwjgl_version}:${nativesClassifier}"
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}

// ---------------------------------------------------------------------------------------------
// Name the tests that failed, from the XML reports, whenever the test task ends -- including when
// it ends by failing.
//
// testLogging above does print failures, but the CI workflow greps the build log for a fixed set of
// patterns and annotates only the first fifteen matches, so a failure whose text does not contain
// one of them is invisible: the build reports "There were failing tests" and nothing else, which
// turns a one-line diagnosis into guesswork. This prints each failing test as
// "error: test <class>.<method> failed -> <type>: <message>", and the leading "error:" is
// deliberately one of the patterns the workflow looks for.
//
// It is a finalizer rather than a doLast on test, because a doLast does not run when the task it
// belongs to fails -- exactly the case this exists for.
// ---------------------------------------------------------------------------------------------
tasks.register("reportTestFailures") {
    notCompatibleWithConfigurationCache("reads build outputs")
    mustRunAfter(tasks.named("test"))
    doLast {
        def resultsDir = layout.buildDirectory.dir("test-results/test").get().asFile
        def suites = resultsDir.isDirectory()
                ? (resultsDir.listFiles()?.findAll { it.name.endsWith(".xml") }?.sort() ?: [])
                : []
        int reported = 0
        suites.each { File f ->
            def root = new groovy.xml.XmlSlurper().parse(f)
            root.testcase.each { tc ->
                def bad = tc.failure.size() > 0 ? tc.failure[0] : (tc.error.size() > 0 ? tc.error[0] : null)
                if (bad != null) {
                    reported++
                    def message = bad.@message.text().readLines().take(4).join(" / ")
                    println("error: test " + tc.@classname.text() + "." + tc.@name.text()
                            + " failed -> " + bad.@type.text() + ": " + message)
                }
            }
        }
        if (reported == 0) {
            println("reportTestFailures: no failing test cases in " + suites.size() + " suites")
        }
    }
}
tasks.named("test") {
    finalizedBy(tasks.named("reportTestFailures"))
}

// ---------------------------------------------------------------------------------------------
// GLSL -> SPIR-V. The shaders are checked by ShaderCompileTest as well, but that only proves they
// compile; this is what puts the result in the jar. Both matter: without this task the mod would
// ship GLSL and need a compiler at runtime, and without the test the failure mode is a Gradle
// error instead of a readable one.
// ---------------------------------------------------------------------------------------------

def shadersSourceDir = file("src/main/resources/shaders")
def spirvResourceDir = layout.buildDirectory.dir("generated/spirv")

def compileShaders = tasks.register("compileShaders") {
    notCompatibleWithConfigurationCache("invokes shaderc through the build script classpath")
    inputs.dir(shadersSourceDir)
    outputs.dir(spirvResourceDir)

    doLast {
        // A local alias for the class: Groovy cannot import it, because imports are only legal at
        // the top of a script and Gradle wants plugins{} there.
        def shaderc = org.lwjgl.util.shaderc.Shaderc
        def outDir = new File(spirvResourceDir.get().asFile, "shaders")
        outDir.mkdirs()

        long compiler = shaderc.shaderc_compiler_initialize()
        if (compiler == 0L) {
            throw new GradleException("shaderc_compiler_initialize returned null; "
                    + "the natives for this platform may not be on the build script classpath")
        }
        long options = shaderc.shaderc_compile_options_initialize()
        try {
            shaderc.shaderc_compile_options_set_source_language(options,
                    shaderc.shaderc_source_language_glsl)
            shaderc.shaderc_compile_options_set_target_env(options, shaderc.shaderc_target_env_vulkan,
                    shaderc.shaderc_env_version_vulkan_1_2)

            // Shader kind is picked from the extension, because shaderc needs to be told which
            // stage it is compiling: the same GLSL is a different program per stage and the errors
            // it produces otherwise ("gl_WorkGroupID undeclared") point nowhere near the real fault.
            def kindFor = { String name ->
                if (name.endsWith(".vert")) return shaderc.shaderc_glsl_vertex_shader
                if (name.endsWith(".frag")) return shaderc.shaderc_glsl_fragment_shader
                return shaderc.shaderc_glsl_compute_shader
            }
            // Compute shaders keep their existing names; the graphics stages are suffixed so that
            // block.vert and block.frag do not both claim block.spv.
            def spvName = { String name ->
                int dot = name.lastIndexOf('.')
                String base = name.substring(0, dot)
                String ext = name.substring(dot + 1)
                return ext == "comp" ? base + ".spv" : base + "_" + ext + ".spv"
            }

            def sources = shadersSourceDir.listFiles()?.findAll {
                it.name.endsWith(".comp") || it.name.endsWith(".vert") || it.name.endsWith(".frag")
            }?.sort() ?: []
            if (sources.isEmpty()) {
                throw new GradleException("no shaders in " + shadersSourceDir)
            }
            sources.each { File source ->
                long result = shaderc.shaderc_compile_into_spv(compiler, source.text,
                        kindFor(source.name), source.name, "main", options)
                if (result == 0L) {
                    throw new GradleException("shaderc_compile_into_spv returned null for " + source.name)
                }
                try {
                    int status = shaderc.shaderc_result_get_compilation_status(result)
                    if (status != shaderc.shaderc_compilation_status_success) {
                        // Keep it on one line so the CI log grep picks it up.
                        throw new GradleException("GLSL compile failed for " + source.name + " -> "
                                + shaderc.shaderc_result_get_error_message(result))
                    }
                    def bytes = shaderc.shaderc_result_get_bytes(result)
                    def out = new byte[bytes.remaining()]
                    bytes.get(out)
                    def target = new File(outDir, spvName(source.name))
                    target.bytes = out
                    println("compiled " + source.name + " -> shaders/" + target.name
                            + " (" + out.length + " bytes of SPIR-V)")
                } finally {
                    shaderc.shaderc_result_release(result)
                }
            }
        } finally {
            shaderc.shaderc_compile_options_release(options)
            shaderc.shaderc_compiler_release(compiler)
        }
    }
}

processResources {
    def modVersion = project.version

    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }

    // The compiled shader modules go straight into the processed resources rather than through a
    // source set srcDir. Registering build/generated as a resources root also made the sources jar
    // consume another task's output without depending on it, which Gradle rejects.
    dependsOn(compileShaders)
    from(spirvResourceDir) {
        include "**/*.spv"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// ---------------------------------------------------------------------------
// Self-verification
//
// The CI workflow redirects Gradle's stdout into a log file and only greps that
// file when the build fails, so printed diagnostics are invisible on a green
// build and logs/artifacts are served from blob storage that is not reachable
// from every client. Printing a report is therefore worthless here: the build
// has to *assert* what it produced and fail loudly instead.
// ---------------------------------------------------------------------------
tasks.register("verifyJar") {
    notCompatibleWithConfigurationCache("reads build outputs and fails the build if they are wrong")
    dependsOn(tasks.named("jar"))
    dependsOn(tasks.named("test"))

    doLast {
        def problems = []

        // --- unit tests actually ran, and passed ----------------------------
        def resultsDir = layout.buildDirectory.dir("test-results/test").get().asFile
        def suites = resultsDir.isDirectory()
                ? (resultsDir.listFiles()?.findAll { it.name.endsWith(".xml") }?.sort() ?: [])
                : []
        if (suites.isEmpty()) {
            problems << "no test results in build/test-results/test: the test task did not run"
        }
        int total = 0, failed = 0, errored = 0, skipped = 0
        suites.each { File f ->
            def root = new groovy.xml.XmlSlurper().parse(f)
            // XmlSlurper exposes attributes as .@name, not .attribute(name).
            def num = { node ->
                def v = node.text().trim()
                v.isEmpty() ? 0 : v.toInteger()
            }
            total += num(root.@tests)
            failed += num(root.@failures)
            errored += num(root.@errors)
            skipped += num(root.@skipped)
            println("test suite " + root.@name.text() + ": " + num(root.@tests) + " tests")
        }
        if (total < 10) {
            problems << "only " + total + " tests ran across " + suites.size() + " suites; expected at least 10"
        }
        if (failed > 0 || errored > 0) {
            problems << failed + " test failures and " + errored + " test errors"
        }
        println("tests: " + total + " run, " + failed + " failed, " + errored + " errors, " + skipped + " skipped")

        // --- the produced jar is a loadable mod -----------------------------
        def libs = layout.buildDirectory.dir("libs").get().asFile
        def main = libs.isDirectory()
                ? (libs.listFiles()?.findAll { it.name.endsWith(".jar") && !it.name.contains("sources") }?.sort() ?: [])
                : []
        if (main.isEmpty()) {
            problems << "no main jar in build/libs"
        }
        main.each { File jar ->
            def zip = new java.util.zip.ZipFile(jar)
            try {
                def names = zip.entries().toList().collect { it.name }
                println("jar " + jar.name + ": " + jar.length() + " bytes, " + names.size() + " entries")

                def required = [
                        "fabric.mod.json",
                        "net/amdfaster/AmdFasterClient.class",
                        "net/amdfaster/platform/GpuReport.class",
                        "net/amdfaster/platform/GpuIdentity.class",
                        // Decides what AMD-Faster yields when Sodium is really rendering. Asserted because
                        // its absence would not fail loudly: every subsystem would simply stay on, and the
                        // failure would be two mods meshing the same sections rather than a missing class.
                        "net/amdfaster/compat/SodiumCoexistence.class",
                        // Chunk rebuild time, one of the five benchmark figures. Asserted because a missing
                        // timing class would not break the build -- it would quietly drop the figure from
                        // the overlay and the benchmark would report four numbers instead of five.
                        "net/amdfaster/perf/MeshBuildTimer.class",
                        // GPU time, the fifth and last benchmark figure. Asserted because a missing query
                        // pool would not fail the build -- it would drop the only figure that distinguishes
                        // a CPU-bound frame from a GPU-bound one, and the benchmark would still look
                        // complete with four numbers on screen.
                        "net/amdfaster/perf/GpuTimestampQuery.class",
                        // The faster random source. Asserted because its absence would not break the build
                        // and would not change a single picture: particle jitter would quietly go back to
                        // the contended legacy path, and the named hot spot would simply stop being
                        // addressed with nothing to show it.
                        "net/amdfaster/rng/FastRandom.class",
                        // The device's timestamp counter. Asserted because a missing reader would not fail
                        // the build -- it would leave GPU time unmeasured while the overlay still showed
                        // every other figure, so the benchmark would look complete with one number absent.
                        "net/amdfaster/vk/TimestampSupport.class",
                        // The entity half of an explosion, which nothing had. Asserted because a missing
                        // class would not fail the build -- it would leave exposure damage and knockback
                        // computed the expensive way with nothing on the overlay to show it.
                        "net/amdfaster/explosion/EntityExposureCache.class",
                        // Aokana equation 1, the LOD streaming rule. Asserted because a missing class
                        // would not fail the build -- it would leave sections streaming at a level nobody
                        // chose and the horizon would fill in an order nobody picked.
                        "net/amdfaster/mesh/LodStreamScheduler.class",
                        // The destroy list, packed and reused. Asserted because a missing class would not
                        // fail the build -- it would leave each blast allocating a boxed set the collector
                        // then walks, on the same thread the explosion runs on.
                        "net/amdfaster/explosion/BlastDamageBuffer.class",
                        // The octree frustum walk. Asserted because a missing class would not fail the
                        // build -- it would leave every section tested individually, every frame, and
                        // nothing on the overlay would say so.
                        "net/amdfaster/cull/HierarchicalFrustumCuller.class",
                        // The depth pre-pass decision. Asserted because a missing class would not fail the
                        // build -- it would leave the pre-pass either always on or always off, and both are
                        // wrong for some frames.
                        "net/amdfaster/render/DepthPrepassSelector.class",
                        // The layer-separated rebuild decision. Asserted because a missing class would not
                        // fail the build -- it would leave every light change rebuilding the whole mesh,
                        // which is slower but still correct, so nothing would report it.
                        "net/amdfaster/mesh/LightOnlyRebuildPlanner.class",
                        // The intra-section delta region. Asserted because a missing class would not fail
                        // the build -- it would leave every block change re-meshing a whole 4,096 cell
                        // section, which is slower but still correct, so nothing would report it.
                        "net/amdfaster/mesh/SectionDeltaPlanner.class",
                        // The coalescing check. Asserted because it is a bandwidth check and not a
                        // correctness one: if the class vanished every stride would still upload and draw
                        // fine, just fetching half the bytes it needs on the light and index streams, and
                        // nothing would report that.
                        "net/amdfaster/gpu/CoalescingVerifier.class",
                        // The specialization planner. Asserted because nothing else would notice it
                        // missing: every shader still compiles and every draw still works, just with the
                        // branches left in the binary where folding would have deleted them.
                        "net/amdfaster/gpu/SpecializationPlanner.class",
                        // The occupancy planner. Asserted because a missing class would not fail anything:
                        // every dispatch would still run, just at a wave size picked by nothing, and the
                        // shader would sit on half the lanes it could have had.
                        "net/amdfaster/gpu/OccupancyPlanner.class",
                        // The blast phase planner. Asserted because sharing a cache between two
                        // overlapping explosions produces terrain that survives a blast it should not
                        // have, and that reads as a weak explosion rather than a wrong one.
                        "net/amdfaster/explosion/BlastPhasePlanner.class",
                        // The per-generation path selector. Asserted because it feeds the early-Z
                        // suppression flag, and a missing class would leave RDNA4 taking forward-pass
                        // decisions as though early-Z still worked.
                        "net/amdfaster/platform/PathSelector.class",
                        // The buffer pool. Asserted because recycling a buffer whose fence has not
                        // signalled is not a slowdown, it is geometry belonging to neither section, and
                        // the draw still completes so nothing reports it.
                        "net/amdfaster/gpu/BufferPool.class",
                        // The capability-to-path mapping. Asserted because a missing class would leave
                        // every probed extension unused, and the renderer would still run -- just on the
                        // fallback path, which looks identical apart from the frame rate.
                        "net/amdfaster/platform/FeaturePaths.class",
                        // The indirect count draw arithmetic. Asserted because an overstated maxDrawCount
                        // is a validation error at the draw, and a device count that is not clamped would
                        // let a broken cull shader draw past the buffer that was allocated.
                        "net/amdfaster/gpu/IndirectCountDraw.class",
                        // The mesh-shader backend selector. Asserted because it is the guard against
                        // adding a task shader on top of the compute cull, which would cull every meshlet
                        // twice and pay a fixed VRAM ring for the second pass.
                        "net/amdfaster/render/MeshShaderBackendSelector.class",
                        // The blast allocation model. Asserted because it is the check on the claim that
                        // packing the destroy list matters: without it the saving is asserted rather than
                        // sized against the game's actual allocation rate.
                        "net/amdfaster/explosion/BlastAllocationModel.class",
                        // The frame dispatcher. Asserted because an omitted barrier between the cull and
                        // the indirect draw is not a crash: it is a draw reading commands that are not
                        // visible yet, which shows up as flickering geometry.
                        "net/amdfaster/vk/FrameDispatcher.class",
                        // The audio LOD selector. Asserted because a missing class would leave every
                        // distant sound mixed at full rate, which costs the same and sounds identical,
                        // so nothing would report the difference.
                        "net/amdfaster/sound/AudioLodSelector.class",
                        // The hot/cold splitter. Asserted because its job is as often to say a split is
                        // not worth making as to plan one, and a missing class would silently leave both
                        // answers unasked.
                        "net/amdfaster/cpu/HotColdSplitter.class",
                        // The false sharing planner. Asserted because the failure it prevents is a
                        // throughput loss that no profiler names: the code is correct and the counters
                        // are right, the line just ping-pongs between cores five times more than it
                        // needs to.
                        "net/amdfaster/cpu/FalseSharingPlanner.class",
                        // The inlining thresholds. Asserted because the correction it carries is the
                        // opposite of the usual shorthand: 35 bytes is the limit for a method that is
                        // *not* hot, and a hot one gets 325. A missing class would leave the splitting
                        // effort aimed at the wrong methods.
                        "net/amdfaster/cpu/InliningBudget.class",
                        // What measures the bytecode size the thresholds above are compared against.
                        // Asserted because a missing reader does not fail loudly: the mesh path falls back
                        // to "cannot scalar replace" and quietly keeps buffers it did not need.
                        "net/amdfaster/cpu/BytecodeSizes.class",
                        // The mixin layer. Asserted class by class because a mixin that is missing from
                        // the jar is not an error at load time: the config lists it, Mixin cannot find it,
                        // and with "required" false the whole config is skipped and the mod quietly loses
                        // every hook in it.
                        "net/amdfaster/mixin/ClientPacketListenerMixin.class",
                        "net/amdfaster/mixin/LevelRendererMixin.class",
                        "net/amdfaster/mixin/ParticleEngineMixin.class",
                        "net/amdfaster/mixin/ParticleMixin.class",
                        "net/amdfaster/mixin/SoundManagerMixin.class",
                        // The config that names them. Unlisted in fabric.mod.json it is never read, and
                        // nothing else fails.
                        "amdfaster.mixins.json",
                        "net/amdfaster/platform/AmdArchitecture.class",
                        "net/amdfaster/platform/OccupancyModel.class",
                        "net/amdfaster/command/AmdFasterCommand.class",
                        "net/amdfaster/light/SmoothLight.class",
                        "net/amdfaster/light/LightField.class",
                        "net/amdfaster/light/LightQueue.class",
                        "net/amdfaster/light/LightEngine.class",
                        "net/amdfaster/light/OpacityField.class",
                        "net/amdfaster/light/SkyHeightmap.class",
