                        // asserted because a wrong fixed stride here is not a crash: it misaligns
                        // every meshlet after the first short one, and every draw reads the
                        // previous meshlet's vertices.
                        "net/amdfaster/gpu/SectionUpload.class",
                        "assets/amdfaster/icon.png",
                        // The mod ships pre-compiled SPIR-V, not GLSL: no player should need a
                        // shader toolchain, and a missing module fails at pipeline creation with
                        // no useful message.
                        "shaders/meshlet_cull.spv",
                        "shaders/meshlet_occlusion.spv",
                        "shaders/hiz_reduce.spv",
                        "shaders/entity_occlusion.spv",
                        "shaders/block_vert.spv",
                        "shaders/block_frag.spv"
                ]
                required.findAll { !names.contains(it) }.each { problems << jar.name + " is missing " + it }

                // Minecraft ships lwjgl, lwjgl-glfw and lwjgl-opengl but not lwjgl-vulkan, so the
                // Vulkan bindings have to be jar-in-jar'd or the mod cannot load them at runtime.
                def nested = names.findAll { it.startsWith("META-INF/jars/") && it.endsWith(".jar") }
                        .collect { it.substring(it.lastIndexOf("/") + 1) }
                if (!nested.any { it.startsWith("lwjgl-vulkan-") }) {
                    problems << jar.name + " does not bundle lwjgl-vulkan (found: " + nested + ")"
                }

                def entry = zip.getEntry("fabric.mod.json")
                if (entry == null) {
                    problems << jar.name + " has no fabric.mod.json"
                } else {
                    def text = zip.getInputStream(entry).getText("UTF-8")
                    def version = (text =~ /"version"\s*:\s*"([^"]*)"/)
                    def ver = version ? version[0][1].toString() : null
                    println("jar " + jar.name + ": version " + ver + ", jar-in-jar " + nested.sort())
                    if (ver == null) {
                        problems << jar.name + ": fabric.mod.json has no version field"
                    } else if (ver.contains('$') || ver != project.version.toString()) {
                        problems << jar.name + ": fabric.mod.json version is '" + ver
                                + "' but the project version is '" + project.version + "'"
                    }
                    def entrypoint = (text =~ /"client"\s*:\s*\[\s*"([^"]*)"/)
                    if (!entrypoint || entrypoint[0][1].toString() != "net.amdfaster.AmdFasterClient") {
                        problems << jar.name + ": fabric.mod.json client entrypoint is wrong"
                    }
                    // A mixin config that is not listed here is never read, and no other check fails:
                    // the classes are in the jar, the config is in the jar, and the mod simply runs
                    // without any of its hooks. That is the quietest way for all of this to do nothing.
                    def mixinConfig = (text =~ /"mixins"\s*:\s*\[\s*"([^"]*)"/)
                    if (!mixinConfig || mixinConfig[0][1].toString() != "amdfaster.mixins.json") {
                        problems << jar.name + ": fabric.mod.json does not list amdfaster.mixins.json"
                    }
                }
            } finally {
                zip.close()
            }
        }

        if (!problems.isEmpty()) {
            // One line: the CI workflow only echoes log lines that match a fixed error
            // pattern, and "Caused by:" is one of them. A multi-line message would put the
            // actual problems on lines that never reach the annotation.
            throw new GradleException("build output verification failed -> " + problems.join(" | "))
        }
    }
}

// ---------------------------------------------------------------------------------------------
// Mixin target verification.
//
// A mixin target is a string, so javac cannot check it. A name that is wrong does not fail this
// build: it fails at game startup, in front of a player, as an InvalidInjectionException -- or, with
// the config's "required" turned off, it does nothing and the mod quietly stops doing the thing the
// mixin was there for. Both are worse than a build failure, and neither is visible from here.
//
// The names also move. runTick gained a DeltaTracker when the tick delta stopped being a float, and
// getFrameTime went away with it. So every target is checked against the jar actually being compiled
// against, by reading the class file with ASM. Reading rather than loading, because loading
// Minecraft's classes needs LWJGL's natives on the build machine and runs their static initialisers.
//
// When a target is missing, the failure message carries every method of every class in the table.
// The useful answer is never "this name is wrong", it is "here is what it is called now", and this
// is the only place in the toolchain that can say so. It is one line because the workflow's error
// grep reaches it through "Caused by:".
// ---------------------------------------------------------------------------------------------

// class, method, descriptor -- one row per mixin injection point.
def mixinTargetTable = [
        // The frame loop and the game tick.
        ["net.minecraft.client.Minecraft", "runTick", "(Z)V"],
        ["net.minecraft.client.Minecraft", "tick", "()V"],
        // A placed or broken block becoming visible on the client.
        ["net.minecraft.world.level.Level", "setBlock",
         "(Lnet/minecraft/core/BlockPos;Lnet/minecraft/world/level/block/state/BlockState;II)Z"],
        // The two per-event paths Fabric API has no hook for.
        ["net.minecraft.client.particle.ParticleEngine", "add",
         "(Lnet/minecraft/client/particle/Particle;)V"],
        // Both play methods return a PlayResult, so a cancellable injection has to supply one. NOT_STARTED
        // is the value the method already returns when a sound is not started, which is what makes
        // cancelling it safe: callers handle that answer because they have to.
        ["net.minecraft.client.sounds.SoundManager", "play",
         "(Lnet/minecraft/client/resources/sounds/SoundInstance;)Lnet/minecraft/client/sounds/SoundEngine\$PlayResult;"],
        // What the server tells the client about blocks and light.
        ["net.minecraft.client.multiplayer.ClientPacketListener", "handleBlockUpdate",
         "(Lnet/minecraft/network/protocol/game/ClientboundBlockUpdatePacket;)V"],
        ["net.minecraft.client.multiplayer.ClientPacketListener", "handleChunkBlocksUpdate",
         "(Lnet/minecraft/network/protocol/game/ClientboundSectionBlocksUpdatePacket;)V"],
        ["net.minecraft.client.multiplayer.ClientPacketListener", "handleLightUpdatePacket",
         "(Lnet/minecraft/network/protocol/game/ClientboundLightUpdatePacket;)V"],
        // Terrain invalidation.
        ["net.minecraft.client.renderer.LevelRenderer", "allChanged", "()V"],
        // What the culling frame reads: camera and window.
        // Camera's accessors are record-style in 1.21.11: position(), xRot(), yRot(). There is no
        // getPos, getXRot or getYRot at all, which is exactly the kind of rename this table exists to
        // catch before it reaches a player.
        ["net.minecraft.client.Camera", "position", "()Lnet/minecraft/world/phys/Vec3;"],
        ["net.minecraft.client.Camera", "xRot", "()F"],
        ["net.minecraft.client.Camera", "yRot", "()F"],
        // Where the camera comes from.
        ["net.minecraft.client.renderer.GameRenderer", "getMainCamera", "()Lnet/minecraft/client/Camera;"],
        // Everything a mixin handler is about to call, checked here for the same reason the injection
        // points are: a mixin's target is a string, but the code inside the handler is ordinary Java and
        // javac does check it -- so these rows are the ones that would otherwise only be caught one build
        // later, after a handler had been written against a method that is not there.
        ["net.minecraft.network.protocol.game.ClientboundBlockUpdatePacket", "getPos",
         "()Lnet/minecraft/core/BlockPos;"],
        ["net.minecraft.network.protocol.game.ClientboundSectionBlocksUpdatePacket", "runUpdates",
         "(Ljava/util/function/BiConsumer;)V"],
        ["net.minecraft.network.protocol.game.ClientboundLightUpdatePacket", "getX", "()I"],
        ["net.minecraft.network.protocol.game.ClientboundLightUpdatePacket", "getZ", "()I"],
        // Declared on Vec3i and inherited by BlockPos, which is why the verifier walks superclasses.
        ["net.minecraft.core.Vec3i", "getX", "()I"],
        ["net.minecraft.core.Vec3i", "getY", "()I"],
        ["net.minecraft.core.Vec3i", "getZ", "()I"],
        ["net.minecraft.world.phys.Vec3", "x", "()D"],
        ["net.minecraft.world.phys.Vec3", "y", "()D"],
        ["net.minecraft.world.phys.Vec3", "z", "()D"],
        // remove() is where the share of the budget is given back -- taking one without the other fills
        // the budget permanently and every particle after that is refused. Particle has no accessor for its
        // own type, so the budget keys on the class instead, which needs nothing from Minecraft at all.
        ["net.minecraft.client.particle.Particle", "remove", "()V"],
        // What a sound is, and where it is.
        ["net.minecraft.client.resources.sounds.SoundInstance", "getX", "()D"],
        ["net.minecraft.client.resources.sounds.SoundInstance", "getY", "()D"],
        ["net.minecraft.client.resources.sounds.SoundInstance", "getZ", "()D"],
        ["net.minecraft.client.resources.sounds.SoundInstance", "getSource",
         "()Lnet/minecraft/sounds/SoundSource;"],
        // ResourceLocation is Identifier in 1.21.11 -- renamed, not moved, and the old name is simply gone.
        ["net.minecraft.client.resources.sounds.SoundInstance", "getIdentifier",
         "()Lnet/minecraft/resources/Identifier;"],
        ["net.minecraft.resources.Identifier", "getNamespace", "()Ljava/lang/String;"],
        ["net.minecraft.resources.Identifier", "toString", "()Ljava/lang/String;"],
        // A relative sound has no position, and treating its zeroed coordinates as a place in the world
        // would refuse the interface and the music. isRelative is the same test as comparing the
        // attenuation to NONE, without naming an enum that is not worth depending on.
        ["net.minecraft.client.resources.sounds.SoundInstance", "isRelative", "()Z"],
        // The engine dropping everything, where the grants have to be given back in bulk.
        ["net.minecraft.client.particle.ParticleEngine", "clearParticles", "()V"],
        // Guarding on this is what stops a frame before the camera is placed culling from (0, 0, 0).
        ["net.minecraft.client.Camera", "isInitialized", "()Z"],
        ["com.mojang.blaze3d.platform.Window", "getWidth", "()I"],
        ["com.mojang.blaze3d.platform.Window", "getHeight", "()I"],
        ["net.minecraft.client.Options", "fov", "()Lnet/minecraft/client/OptionInstance;"]
]

// Classes whose whole method list is dumped when anything above fails. Kept to the class actually in
// question: the failure annotation is delivered through the workflow's error line, and a survey of
// Minecraft alone is long enough to be truncated before it reaches the answer.
// Classes whose whole method list is dumped when anything above fails. Kept to the classes actually in
// question: the failure annotation is delivered through the workflow's error line, and a survey of
// Minecraft alone is long enough to be truncated before it reaches the answer.
// Enum constants a switch in the mixins covers. An exhaustive switch with no default is what makes a
// renamed constant a build failure instead of a sound that quietly draws on the wrong budget, but only
// if the constants are the ones this version has -- so they are checked like everything else.
def mixinEnumConstants = [
        "net.minecraft.sounds.SoundSource": ["MASTER", "MUSIC", "RECORDS", "WEATHER", "BLOCKS",
                                             "HOSTILE", "NEUTRAL", "PLAYERS", "AMBIENT", "VOICE"]
]

def mixinSurveyClasses = []

// Simple names to look for anywhere in the jar, for when the question is not what a method is called but
// which package the class ended up in.
def mixinClassSearch = []

tasks.register("verifyMixinTargets") {
    notCompatibleWithConfigurationCache("resolves the compile classpath")
    doLast {
        def classpath = sourceSets.main.compileClasspath.files

        // Every method of a class, read out of the jar rather than loaded, as "name" -> [descriptors].
        def methodsOf = { java.util.zip.ZipFile zip, String className ->
            def entry = zip.getEntry(className.replace('.', '/') + ".class")
            if (entry == null) {
                return null
            }
            def bytes
            zip.getInputStream(entry).withCloseable { input -> bytes = input.bytes }
            def byName = new TreeMap<String, List<String>>()
            def fields = new TreeMap<String, String>()
            def superName = new String[1]
            new org.objectweb.asm.ClassReader(bytes).accept(
                    new org.objectweb.asm.ClassVisitor(org.objectweb.asm.Opcodes.ASM9) {
                        @Override
                        void visit(int version, int access, String name, String signature,
                                String superClass, String[] interfaces) {
                            superName[0] = superClass
                        }

                        @Override
                        org.objectweb.asm.FieldVisitor visitField(int access, String name,
                                String descriptor, String signature, Object value) {
                            fields[name] = descriptor
                            return null
                        }

                        @Override
                        org.objectweb.asm.MethodVisitor visitMethod(int access, String name,
                                String descriptor, String signature, String[] exceptions) {
                            byName.computeIfAbsent(name, { k -> [] }).add(descriptor)
                            return null
                        }
                    },
                    org.objectweb.asm.ClassReader.SKIP_CODE | org.objectweb.asm.ClassReader.SKIP_DEBUG)
            return [methods: byName, fields: fields, superClass: superName[0]]
        }

        // The jar that actually holds Minecraft. Found by content rather than by name, because loom's
        // file name carries the mapping set and the version and neither is worth depending on here.
        java.util.zip.ZipFile minecraft = null
        for (File candidate : classpath) {
            if (!candidate.isFile() || !candidate.name.endsWith(".jar")) {
                continue
            }
            def zip = new java.util.zip.ZipFile(candidate)
            if (zip.getEntry("net/minecraft/client/Minecraft.class") != null) {
                minecraft = zip
                break
            }
            zip.close()
        }
        if (minecraft == null) {
            throw new GradleException("mixin target verification could not find the Minecraft jar on "
                    + "the compile classpath (" + classpath.size() + " entries)")
        }

        try {
            def cache = [:]
            def declared = { String className ->
                if (!cache.containsKey(className)) {
                    cache[className] = methodsOf(minecraft, className)
                }
                return cache[className]
            }
            // Inherited methods count. A verifier that only read a class's own methods reports BlockPos as
            // having no getX, because getX is declared on Vec3i -- and "this target does not exist" for a
            // target that does is worse than no check at all, because it is believed.
            def lookup = { String className ->
                def merged = new TreeMap<String, List<String>>()
                def current = className
                int hops = 0
                while (current != null && current != "java/lang/Object" && hops++ < 32) {
                    def info = declared(current)
                    if (info == null) {
                        break
                    }
                    info.methods.each { String name, List<String> descriptors ->
                        merged.computeIfAbsent(name, { k -> [] }).addAll(descriptors)
                    }
                    current = info.superClass
                }
                return merged.isEmpty() && declared(className) == null ? null : merged
            }

            def problems = []
            def touched = new LinkedHashSet<String>()
            for (List<String> row : mixinTargetTable) {
                def className = row[0]
                def methodName = row[1]
                def descriptor = row[2]
                def methods = lookup(className)
                if (methods == null) {
                    problems << className + " is not in the Minecraft jar"
                    touched << className
                    continue
                }
                if (!(methods[methodName] ?: []).contains(descriptor)) {
                    def overloads = methods[methodName]
                    def detail = overloads == null
                            ? " (no method called " + methodName + " at all)"
                            : " -- " + methodName + " is " + overloads.collect { methodName + it }
                    problems << className + "." + methodName + descriptor + " does not exist" + detail
                    touched << className
                }
            }
            mixinEnumConstants.each { String className, List<String> constants ->
                def info = declared(className)
                if (info == null) {
                    problems << className + " is not in the Minecraft jar"
                    touched << className
                    return
                }
                for (String constant : constants) {
                    if (!info.fields.containsKey(constant)) {
                        problems << className + "." + constant + " is not a constant of that enum"
                        touched << className
                    }
                }
            }
            if (!mixinSurveyClasses.isEmpty() && !problems.isEmpty()) {
                touched.addAll(mixinSurveyClasses)
            }

            if (!problems.isEmpty()) {
                // Names only, and capped per class: the point is to find what a method is called, and an
                // annotation that is too long to be delivered is worse than one that stops early.
                def survey = []
                for (String className : touched) {
                    def info = declared(className)
                    if (info == null) {
                        survey << className + " declares: <absent>"
                        continue
                    }
                    // Fields as well as methods. An enum's constants are static fields, so a survey of
                    // methods alone reports an enum as having no values -- which for a cancellable
                    // injection into a method returning one is precisely the thing being asked.
                    def names = info.methods.keySet().take(500).toList()
                    def fieldNames = info.fields.collect { String name, String descriptor ->
                        name + ":" + descriptor
                    }.take(200)
                    survey << className + " declares: " + names.join(", ")
                    survey << className + " fields: " + (fieldNames ?: ["<none>"]).join(", ")
                }
                def message = "mixin target verification failed -> " + problems.join(" | ")
                message = message + " || SURVEY || " + survey.join(" || ")
                if (!mixinClassSearch.isEmpty()) {
                    def wanted = new LinkedHashSet<String>(mixinClassSearch)
                    def found = [:]
                    // Every jar on the classpath, not just Minecraft's. A class reported as "not in the
                    // jar" may simply live in another one, and the difference matters: one of those is a
                    // wrong name and the other is a wrong assumption about which jar to look in.
                    for (File candidate : classpath) {
                        if (!candidate.isFile() || !candidate.name.endsWith(".jar")) {
                            continue
                        }
                        def scanning = new java.util.zip.ZipFile(candidate)
                        try {
                            for (java.util.zip.ZipEntry entry : Collections.list(scanning.entries())) {
                                def entryName = entry.name
                                if (!entryName.endsWith(".class")) {
                                    continue
                                }
                                def simple = entryName.substring(entryName.lastIndexOf('/') + 1,
                                        entryName.length() - 6)
                                if (wanted.contains(simple)) {
                                    def fqcn = entryName.substring(0, entryName.length() - 6)
                                            .replace('/', '.')
                                    found.computeIfAbsent(simple, { k -> [] })
                                            .add(fqcn + " (" + candidate.name + ")")
                                }
                            }
                        } finally {
                            scanning.close()
                        }
                    }
                    message = message + " || CLASSES || " + mixinClassSearch.collect { String simple ->
                        simple + " -> " + (found[simple] ?: ["<not in the jar>"])
                    }.join(" || ")
                }
                throw new GradleException(message)
            }
            println("verifyMixinTargets: all " + mixinTargetTable.size() + " mixin targets exist")
        } finally {
            minecraft.close()
        }
    }
}

// Before compileJava, not merely as part of check. The handlers are written against these names, so a
// run that happens after compilation can only ever report them once the code already fails to build --
// which is the cycle this task exists to remove.
tasks.named("compileJava") {
    dependsOn(tasks.named("verifyMixinTargets"))
}

tasks.named("check") {
    dependsOn(tasks.named("verifyJar"))
}
