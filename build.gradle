// shaderc on the build script classpath so the GLSL can be compiled to SPIR-V during the build.
// The mod ships the compiled SPIR-V; a player never needs a GLSL toolchain.
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.lwjgl:lwjgl:3.3.3"
        classpath "org.lwjgl:lwjgl-shaderc:3.3.3"
        // LWJGL extracts its natives from the classpath at load time, so the platform classifier
        // has to be here rather than only in the test runtime.
        classpath "org.lwjgl:lwjgl:3.3.3:natives-linux"
        classpath "org.lwjgl:lwjgl-shaderc:3.3.3:natives-linux"
        classpath "org.lwjgl:lwjgl:3.3.3:natives-windows"
        classpath "org.lwjgl:lwjgl-shaderc:3.3.3:natives-windows"
        classpath "org.lwjgl:lwjgl:3.3.3:natives-macos"
        classpath "org.lwjgl:lwjgl-shaderc:3.3.3:natives-macos"
    }
}

plugins {
    id 'fabric-loom' version '1.16.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API is a *runtime* requirement declared in fabric.mod.json, not a
    // jar-in-jar. The Modrinth app resolves it automatically, so AMD-Faster stays
    // a single-file download while never shipping a half-assembled Fabric API.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Minecraft ships lwjgl / lwjgl-glfw / lwjgl-opengl but NOT lwjgl-vulkan,
    // so the Vulkan bindings have to be bundled with the mod.
    include(implementation("org.lwjgl:lwjgl-vulkan:${project.lwjgl_version}"))

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    // shaderc compiles the .comp sources to SPIR-V in ShaderCompileTest. Test-only and not
    // bundled: the mod ships pre-compiled SPIR-V, so a player never needs a GLSL compiler.
    // Without this the shaders are text nobody has checked, and a typo in a compute shader
    // surfaces as a driver error at runtime on someone else's machine.
    testImplementation "org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}"
    for (String nativesClassifier in ["natives-linux", "natives-windows", "natives-macos", "natives-macos-arm64"]) {
        testRuntimeOnly "org.lwjgl:lwjgl-shaderc:${project.lwjgl_version}:${nativesClassifier}"
        testRuntimeOnly "org.lwjgl:lwjgl:${project.lwjgl_version}:${nativesClassifier}"
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}

// ---------------------------------------------------------------------------------------------
// Name the tests that failed, from the XML reports, whenever the test task ends -- including when
// it ends by failing.
//
// testLogging above does print failures, but the CI workflow greps the build log for a fixed set of
// patterns and annotates only the first fifteen matches, so a failure whose text does not contain
// one of them is invisible: the build reports "There were failing tests" and nothing else, which
// turns a one-line diagnosis into guesswork. This prints each failing test as
// "error: test <class>.<method> failed -> <type>: <message>", and the leading "error:" is
// deliberately one of the patterns the workflow looks for.
//
// It is a finalizer rather than a doLast on test, because a doLast does not run when the task it
// belongs to fails -- exactly the case this exists for.
// ---------------------------------------------------------------------------------------------
tasks.register("reportTestFailures") {
    notCompatibleWithConfigurationCache("reads build outputs")
    mustRunAfter(tasks.named("test"))
    doLast {
        def resultsDir = layout.buildDirectory.dir("test-results/test").get().asFile
        def suites = resultsDir.isDirectory()
                ? (resultsDir.listFiles()?.findAll { it.name.endsWith(".xml") }?.sort() ?: [])
                : []
        int reported = 0
        suites.each { File f ->
            def root = new groovy.xml.XmlSlurper().parse(f)
            root.testcase.each { tc ->
                def bad = tc.failure.size() > 0 ? tc.failure[0] : (tc.error.size() > 0 ? tc.error[0] : null)
                if (bad != null) {
                    reported++
                    def message = bad.@message.text().readLines().take(4).join(" / ")
                    println("error: test " + tc.@classname.text() + "." + tc.@name.text()
                            + " failed -> " + bad.@type.text() + ": " + message)
                }
            }
        }
        if (reported == 0) {
            println("reportTestFailures: no failing test cases in " + suites.size() + " suites")
        }
    }
}
tasks.named("test") {
    finalizedBy(tasks.named("reportTestFailures"))
}

// ---------------------------------------------------------------------------------------------
// GLSL -> SPIR-V. The shaders are checked by ShaderCompileTest as well, but that only proves they
// compile; this is what puts the result in the jar. Both matter: without this task the mod would
// ship GLSL and need a compiler at runtime, and without the test the failure mode is a Gradle
// error instead of a readable one.
// ---------------------------------------------------------------------------------------------

def shadersSourceDir = file("src/main/resources/shaders")
def spirvResourceDir = layout.buildDirectory.dir("generated/spirv")

def compileShaders = tasks.register("compileShaders") {
    notCompatibleWithConfigurationCache("invokes shaderc through the build script classpath")
    inputs.dir(shadersSourceDir)
    outputs.dir(spirvResourceDir)

    doLast {
        // A local alias for the class: Groovy cannot import it, because imports are only legal at
        // the top of a script and Gradle wants plugins{} there.
        def shaderc = org.lwjgl.util.shaderc.Shaderc
        def outDir = new File(spirvResourceDir.get().asFile, "shaders")
        outDir.mkdirs()

        long compiler = shaderc.shaderc_compiler_initialize()
        if (compiler == 0L) {
            throw new GradleException("shaderc_compiler_initialize returned null; "
                    + "the natives for this platform may not be on the build script classpath")
        }
        long options = shaderc.shaderc_compile_options_initialize()
        try {
            shaderc.shaderc_compile_options_set_source_language(options,
                    shaderc.shaderc_source_language_glsl)
            shaderc.shaderc_compile_options_set_target_env(options, shaderc.shaderc_target_env_vulkan,
                    shaderc.shaderc_env_version_vulkan_1_2)

            // Shader kind is picked from the extension, because shaderc needs to be told which
            // stage it is compiling: the same GLSL is a different program per stage and the errors
            // it produces otherwise ("gl_WorkGroupID undeclared") point nowhere near the real fault.
            def kindFor = { String name ->
                if (name.endsWith(".vert")) return shaderc.shaderc_glsl_vertex_shader
                if (name.endsWith(".frag")) return shaderc.shaderc_glsl_fragment_shader
                return shaderc.shaderc_glsl_compute_shader
            }
            // Compute shaders keep their existing names; the graphics stages are suffixed so that
            // block.vert and block.frag do not both claim block.spv.
            def spvName = { String name ->
                int dot = name.lastIndexOf('.')
                String base = name.substring(0, dot)
                String ext = name.substring(dot + 1)
                return ext == "comp" ? base + ".spv" : base + "_" + ext + ".spv"
            }

            def sources = shadersSourceDir.listFiles()?.findAll {
                it.name.endsWith(".comp") || it.name.endsWith(".vert") || it.name.endsWith(".frag")
            }?.sort() ?: []
            if (sources.isEmpty()) {
                throw new GradleException("no shaders in " + shadersSourceDir)
            }
            sources.each { File source ->
                long result = shaderc.shaderc_compile_into_spv(compiler, source.text,
                        kindFor(source.name), source.name, "main", options)
                if (result == 0L) {
                    throw new GradleException("shaderc_compile_into_spv returned null for " + source.name)
                }
                try {
                    int status = shaderc.shaderc_result_get_compilation_status(result)
                    if (status != shaderc.shaderc_compilation_status_success) {
                        // Keep it on one line so the CI log grep picks it up.
                        throw new GradleException("GLSL compile failed for " + source.name + " -> "
                                + shaderc.shaderc_result_get_error_message(result))
                    }
                    def bytes = shaderc.shaderc_result_get_bytes(result)
                    def out = new byte[bytes.remaining()]
                    bytes.get(out)
                    def target = new File(outDir, spvName(source.name))
                    target.bytes = out
                    println("compiled " + source.name + " -> shaders/" + target.name
                            + " (" + out.length + " bytes of SPIR-V)")
                } finally {
                    shaderc.shaderc_result_release(result)
                }
            }
        } finally {
            shaderc.shaderc_compile_options_release(options)
            shaderc.shaderc_compiler_release(compiler)
        }
    }
}

processResources {
    def modVersion = project.version

    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }

    // The compiled shader modules go straight into the processed resources rather than through a
    // source set srcDir. Registering build/generated as a resources root also made the sources jar
    // consume another task's output without depending on it, which Gradle rejects.
    dependsOn(compileShaders)
    from(spirvResourceDir) {
        include "**/*.spv"
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// ---------------------------------------------------------------------------
// Self-verification
//
// The CI workflow redirects Gradle's stdout into a log file and only greps that
// file when the build fails, so printed diagnostics are invisible on a green
// build and logs/artifacts are served from blob storage that is not reachable
// from every client. Printing a report is therefore worthless here: the build
// has to *assert* what it produced and fail loudly instead.
// ---------------------------------------------------------------------------
tasks.register("verifyJar") {
    notCompatibleWithConfigurationCache("reads build outputs and fails the build if they are wrong")
    dependsOn(tasks.named("jar"))
    dependsOn(tasks.named("test"))

    doLast {
        def problems = []

        // --- unit tests actually ran, and passed ----------------------------
        def resultsDir = layout.buildDirectory.dir("test-results/test").get().asFile
        def suites = resultsDir.isDirectory()
                ? (resultsDir.listFiles()?.findAll { it.name.endsWith(".xml") }?.sort() ?: [])
                : []
        if (suites.isEmpty()) {
            problems << "no test results in build/test-results/test: the test task did not run"
        }
        int total = 0, failed = 0, errored = 0, skipped = 0
        suites.each { File f ->
            def root = new groovy.xml.XmlSlurper().parse(f)
            // XmlSlurper exposes attributes as .@name, not .attribute(name).
            def num = { node ->
                def v = node.text().trim()
                v.isEmpty() ? 0 : v.toInteger()
            }
            total += num(root.@tests)
            failed += num(root.@failures)
            errored += num(root.@errors)
            skipped += num(root.@skipped)
            println("test suite " + root.@name.text() + ": " + num(root.@tests) + " tests")
        }
        if (total < 10) {
            problems << "only " + total + " tests ran across " + suites.size() + " suites; expected at least 10"
        }
        if (failed > 0 || errored > 0) {
            problems << failed + " test failures and " + errored + " test errors"
        }
        println("tests: " + total + " run, " + failed + " failed, " + errored + " errors, " + skipped + " skipped")

        // --- the produced jar is a loadable mod -----------------------------
        def libs = layout.buildDirectory.dir("libs").get().asFile
        def main = libs.isDirectory()
                ? (libs.listFiles()?.findAll { it.name.endsWith(".jar") && !it.name.contains("sources") }?.sort() ?: [])
                : []
        if (main.isEmpty()) {
            problems << "no main jar in build/libs"
        }
        main.each { File jar ->
            def zip = new java.util.zip.ZipFile(jar)
            try {
                def names = zip.entries().toList().collect { it.name }
                println("jar " + jar.name + ": " + jar.length() + " bytes, " + names.size() + " entries")

                def required = [
                        "fabric.mod.json",
                        "net/amdfaster/AmdFasterClient.class",
                        "net/amdfaster/platform/GpuReport.class",
                        "net/amdfaster/platform/GpuIdentity.class",
                        "net/amdfaster/platform/AmdArchitecture.class",
                        "net/amdfaster/command/AmdFasterCommand.class",
                        "net/amdfaster/light/SmoothLight.class",
                        "net/amdfaster/light/LightCache.class",
                        "net/amdfaster/light/VertexLight.class",
                        "net/amdfaster/entity/EntityBatcher.class",
                        "net/amdfaster/entity/EntityOcclusionCuller.class",
                        "net/amdfaster/cull/PyramidGeometry.class",
                        "net/amdfaster/cull/CameraCutDetector.class",
                        "net/amdfaster/dirty/RebuildScheduler.class",
                        // The Minecraft adapter is the only package that touches net.minecraft, so
                        // asserting it is in the jar also asserts the boundary stayed where it was
                        // designed to be: if this entry ever has to move, something upstream of the
                        // mesher has started depending on Minecraft types.
                        "net/amdfaster/mc/BlockKeys.class",
                        "net/amdfaster/mc/LevelBlockSampler.class",
                        "net/amdfaster/mesh/voxel/SectionMesher.class",
                        "net/amdfaster/gpu/BlockBindings.class",
                        // The packing layer between a section mesh and a mapped GPU buffer. It is
                        // asserted because a wrong fixed stride here is not a crash: it misaligns
                        // every meshlet after the first short one, and every draw reads the
                        // previous meshlet's vertices.
                        "net/amdfaster/gpu/SectionUpload.class",
                        "assets/amdfaster/icon.png",
                        // The mod ships pre-compiled SPIR-V, not GLSL: no player should need a
                        // shader toolchain, and a missing module fails at pipeline creation with
                        // no useful message.
                        "shaders/meshlet_cull.spv",
                        "shaders/meshlet_occlusion.spv",
                        "shaders/hiz_reduce.spv",
                        "shaders/entity_occlusion.spv",
                        "shaders/block_vert.spv",
                        "shaders/block_frag.spv"
                ]
                required.findAll { !names.contains(it) }.each { problems << jar.name + " is missing " + it }

                // Minecraft ships lwjgl, lwjgl-glfw and lwjgl-opengl but not lwjgl-vulkan, so the
                // Vulkan bindings have to be jar-in-jar'd or the mod cannot load them at runtime.
                def nested = names.findAll { it.startsWith("META-INF/jars/") && it.endsWith(".jar") }
                        .collect { it.substring(it.lastIndexOf("/") + 1) }
                if (!nested.any { it.startsWith("lwjgl-vulkan-") }) {
                    problems << jar.name + " does not bundle lwjgl-vulkan (found: " + nested + ")"
                }

                def entry = zip.getEntry("fabric.mod.json")
                if (entry == null) {
                    problems << jar.name + " has no fabric.mod.json"
                } else {
                    def text = zip.getInputStream(entry).getText("UTF-8")
                    def version = (text =~ /"version"\s*:\s*"([^"]*)"/)
                    def ver = version ? version[0][1].toString() : null
                    println("jar " + jar.name + ": version " + ver + ", jar-in-jar " + nested.sort())
                    if (ver == null) {
                        problems << jar.name + ": fabric.mod.json has no version field"
                    } else if (ver.contains('$') || ver != project.version.toString()) {
                        problems << jar.name + ": fabric.mod.json version is '" + ver
                                + "' but the project version is '" + project.version + "'"
                    }
                    def entrypoint = (text =~ /"client"\s*:\s*\[\s*"([^"]*)"/)
                    if (!entrypoint || entrypoint[0][1].toString() != "net.amdfaster.AmdFasterClient") {
                        problems << jar.name + ": fabric.mod.json client entrypoint is wrong"
                    }
                }
            } finally {
                zip.close()
            }
        }

        if (!problems.isEmpty()) {
            // One line: the CI workflow only echoes log lines that match a fixed error
            // pattern, and "Caused by:" is one of them. A multi-line message would put the
            // actual problems on lines that never reach the annotation.
            throw new GradleException("build output verification failed -> " + problems.join(" | "))
        }
    }
}

tasks.named("check") {
    dependsOn(tasks.named("verifyJar"))
}
