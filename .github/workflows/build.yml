name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - name: Build
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::Gradle build failed (exit $code) — error lines:"
            grep -nE "error:|cannot find symbol|incompatible types|\.java:[0-9]+:|Compilation failed|Caused by:|> Task .*FAILED|AssertionFailedError|expected:|but was:|Unresolved" /tmp/build.log | head -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "===== TAIL ====="; tail -50 /tmp/build.log
          fi
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn
      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*.jar
          if-no-files-found: ignore
