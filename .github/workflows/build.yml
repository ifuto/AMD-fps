name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install glslangValidator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Verify SPIR-V is up to date
        run: |
          cp -r src/main/resources/assets/amdfaster/spirv /tmp/spirv-before
          ./tools/compile_shaders.sh
          if ! diff -r /tmp/spirv-before src/main/resources/assets/amdfaster/spirv; then
            echo "::error::Committed SPIR-V is stale — run ./tools/compile_shaders.sh and commit the result"
            exit 1
          fi
      - name: Build
        run: |
          set +e
          ./gradlew build --no-daemon --stacktrace > /tmp/build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error::Gradle build failed (exit $code) — error lines:"
            grep -nE "error:|cannot find symbol|incompatible types|\.java:[0-9]+:|Compilation failed|Caused by:|> Task .*FAILED|AssertionFailedError|expected:|but was:|Unresolved" /tmp/build.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "===== TAIL ====="; tail -80 /tmp/build.log
          fi
          exit $code
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn
      - name: Upload jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*.jar
          if-no-files-found: ignore
