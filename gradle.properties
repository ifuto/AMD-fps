# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric (1.21.11 = the last obfuscated Minecraft version)
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
loom_version=1.18

# Mod properties
version=0.1.0
maven_group=dev.amdfaster
archives_base_name=amd-faster

# Dependencies
fabric_api_version=0.141.6+1.21.11
junit_version=5.11.4

# --- AMD toolchain (optional, see docs/AMD-TOOLCHAIN.md) ---------------------
# When true, `gradlew shadowToolchainJar` (or -PincludeAmdToolchain) bundles the
# AMD LLVM-based pipeline compiler (LLPC) natives into the mod jar so that the
# offline shader/ISA analysis path works with zero manual setup (Modrinth friendly).
includeAmdToolchain=false
llpc_version=v2025-01-20

# Export the mapped/decompiled Minecraft jar next to the mod jar during CI builds
withMcSources=true
