# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric (1.21.11 = the last obfuscated Minecraft version)
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.5
# "auto" selects the newest Loom release that runs on the JVM executing the build
loom_version=auto

# Mod properties
version=0.1.0
maven_group=dev.amdfaster
archives_base_name=amd-faster

# Dependencies
fabric_api_version=0.141.6+1.21.11
junit_version=5.11.4

# --- AMD toolchain (optional, see docs/AMD-TOOLCHAIN.md) ---------------------
# When true, `gradlew shadowToolchainJar` (or -PincludeAmdToolchain) bundles the
# AMD LLVM-based pipeline compiler (LLPC) natives into the mod jar so that the
# offline shader/ISA analysis path works with zero manual setup (Modrinth friendly).
includeAmdToolchain=false
llpc_version=v2025-01-20

# Export the mapped/decompiled Minecraft jar next to the mod jar during CI builds
withMcSources=false

# CI diagnostics: the build prints its own failure summary so that a failing run is
# debuggable from check annotations alone.
ciDiagnostics=true

# Development helper: emit Minecraft sources through CI annotations.
# Examples: exfil=classes@12:client/renderer/chunk/SectionRenderDispatcher,client/renderer/chunk/CompiledSectionMesh,client/renderer/chunk/SectionMesh,client/renderer/chunk/SectionBuffers,client/renderer/chunk/SectionCompiler,client/renderer/chunk/ChunkSectionsToRender
exfil=classes@12:client/renderer/chunk/SectionRenderDispatcher,client/renderer/chunk/CompiledSectionMesh,client/renderer/chunk/SectionMesh,client/renderer/chunk/SectionBuffers,client/renderer/chunk/SectionCompiler,client/renderer/chunk/ChunkSectionsToRender

# ---------------------------------------------------------------------------
# Vulkan path
# ---------------------------------------------------------------------------
# Must match the LWJGL version Minecraft 1.21.11 bundles (3.3.3) so that a single
# LWJGL is loaded in the process.
lwjgl_version=3.3.3
# Bundle shaderc/spvc (runtime GLSL -> SPIR-V) in the jar; off by default because the
# natives are large and AMD-Faster compiles its shaders offline by default.
includeShaderCompiler=false
